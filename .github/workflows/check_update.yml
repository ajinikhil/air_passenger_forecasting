name: Automated Aviation Forecasting Update

on:
  schedule:
    - cron: '0 12 1,15 * *'
  workflow_dispatch:

jobs:
  run-notebook-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install papermill jupyter

      - name: Execute automated forecasting notebook
        run: |
          cd script
          papermill automated_forecasting.ipynb automated_forecasting.ipynb

      - name: Commit and push updated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dataset/ plots/ script/automated_forecasting.ipynb
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated bi-weekly forecast notebook update" && git push)